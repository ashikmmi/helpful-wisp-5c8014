<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Forms</title></head>
<body>
<!-- Static skeleton so Netlify registers the feedback form fields rendered by JavaScript in index.html -->
<form name="event-feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="event-feedback">
  <input type="text" name="name">
  <input type="hidden" name="guest-id">
  <input name="bot-field">
  <input type="radio" name="satisfaction" value="">
  <input type="radio" name="food-beverages" value="">
  <input type="radio" name="fun-activities" value="">
  <input type="radio" name="arrangements-housekeeping" value="">
  <input type="radio" name="event-coordination" value="">
  <textarea name="remarks"></textarea>
</form>
</body></html>
